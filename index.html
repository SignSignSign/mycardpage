<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="个人数字名片 · Personal Digital Card" />
    <title>数字名片 · My Digital Card</title>

    <!-- ===== Tailwind CSS（CDN，首次加载需要联网） ===== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ===== 二维码已替换为用户自定义图片，不再需要 QRCode.js ===== -->

    <!-- ===== Tailwind 自定义配置：扩展主题色、深色模式 class 策略 ===== -->
    <script>
        tailwind.config = {
            darkMode: 'class',           // 使用 class 切换深色模式
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0efff',
                            200: '#bae0ff',
                            300: '#7cc6ff',
                            400: '#3aa6ff',
                            500: '#1689ff',   // 主品牌色
                            600: '#0a6ce6',
                            700: '#0b56b8',
                            800: '#0f4992',
                            900: '#123d76',
                        },
                    },
                    fontFamily: {
                        sans: ['"PingFang SC"', '"Microsoft YaHei"', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        floatSoft: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        pop: {
                            '0%': { opacity: '0', transform: 'scale(0.92)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                    },
                    animation: {
                        'fade-up': 'fadeUp .6s ease-out both',
                        'float-soft': 'floatSoft 4s ease-in-out infinite',
                        'shimmer': 'shimmer 2.4s linear infinite',
                        'pop': 'pop .4s ease-out both',
                    },
                },
            },
        }
    </script>

    <!-- ===== 自定义样式：渐变背景、玻璃卡片、无障碍 ===== -->
    <style>
        /* 柔和渐变背景（浅色/深色自适应） */
        body {
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(22, 137, 255, 0.18), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(168, 85, 247, 0.14), transparent 60%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            background-attachment: fixed;
        }

        .dark body {
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(22, 137, 255, 0.25), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(168, 85, 247, 0.20), transparent 60%),
                linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
        }

        /* 玻璃拟态卡片 */
        .glass {
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
        }

        /* 技能标签的彩色渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #1689ff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Toast 提示 */
        .toast {
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .25s ease, transform .25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 尊重用户的减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* 焦点可见性（键盘无障碍） */
        :focus-visible {
            outline: 2px solid #1689ff;
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* 滚动条美化（Webkit） */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .45);
            border-radius: 8px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, .6);
        }
    </style>
</head>

    <!-- ============================================================
       JAVASCRIPT：主题、统计、复制
       ============================================================ -->
    <script>
            (function () {
                'use strict';

                /* ========================================================
                 * 1. 主题切换（深色 / 浅色）
                 *    - 优先级：localStorage > 系统偏好
                 *    - 切换时写入 <html class="dark"> 并持久化
                 * ====================================================== */
                const THEME_KEY = 'card.theme';
                const html = document.documentElement;

                function applyTheme(isDark) {
                    html.classList.toggle('dark', isDark);
                }

                function initTheme() {
                    const saved = localStorage.getItem(THEME_KEY);
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const isDark = saved !== null ? saved === 'dark' : prefersDark;
                    applyTheme(isDark);
                }

                function toggleTheme() {
                    const isDark = !html.classList.contains('dark');
                    applyTheme(isDark);
                    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
                }

                document.getElementById('themeToggle').addEventListener('click', toggleTheme);

                /* ========================================================
                 * 2. 模拟访问浏览统计（localStorage）
                 *    - total: 累计访问次数
                 *    - today: 今日访问次数（按日期重置）
                 *    - wechat: 来自微信（通过 UA 或 ?from=wechat）
                 *    - copy: 复制联系方式次数
                 * ====================================================== */
                const STATS_KEY = 'card.stats';

                function todayStr() {
                    const d = new Date();
                    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
                }

                function loadStats() {
                    try {
                        const raw = localStorage.getItem(STATS_KEY);
                        return raw ? JSON.parse(raw) : null;
                    } catch { return null; }
                }

                function saveStats(s) {
                    localStorage.setItem(STATS_KEY, JSON.stringify(s));
                }

                function initStats() {
                    let stats = loadStats();
                    const today = todayStr();

                    if (!stats) {
                        // 首次访问：初始化，总访问给个好看的起点
                        stats = { total: 137, today: 1, todayDate: today, wechat: 42, copy: 8 };
                    } else {
                        // 每次打开都 +1
                        stats.total = (stats.total || 0) + 1;

                        // 今日：如果日期变了，重置
                        if (stats.todayDate !== today) {
                            stats.todayDate = today;
                            stats.today = 1;
                        } else {
                            stats.today = (stats.today || 0) + 1;
                        }

                        // 检测是否来自微信
                        const isWechatUA = /micromessenger/i.test(navigator.userAgent);
                        const fromQuery = /[?&]from=wechat/i.test(location.search);
                        if (isWechatUA || fromQuery) {
                            stats.wechat = (stats.wechat || 0) + 1;
                        }
                    }

                    saveStats(stats);
                    renderStats(stats);
                }

                function renderStats(s) {
                    document.getElementById('statTotal').textContent = (s.total || 0).toLocaleString();
                    document.getElementById('statToday').textContent = (s.today || 0).toLocaleString();
                    document.getElementById('statWechat').textContent = (s.wechat || 0).toLocaleString();
                    document.getElementById('statCopy').textContent = (s.copy || 0).toLocaleString();
                }

                function incrementCopy() {
                    const stats = loadStats() || { total: 0, today: 0, todayDate: todayStr(), wechat: 0, copy: 0 };
                    stats.copy = (stats.copy || 0) + 1;
                    saveStats(stats);
                    renderStats(stats);
                }

                document.getElementById('resetStats').addEventListener('click', function () {
                    if (!confirm('确定要重置所有统计数据吗？')) return;
                    localStorage.removeItem(STATS_KEY);
                    initStats();
                    showToast('统计已重置');
                });

                /* ========================================================
                 * 3. 复制到剪贴板 + Toast 提示
                 *    - 优先 navigator.clipboard（HTTPS / 现代浏览器）
                 *    - 降级 document.execCommand('copy')
                 * ====================================================== */
                const toastEl = document.getElementById('toast');
                let toastTimer = null;

                function showToast(msg) {
                    toastEl.textContent = msg;
                    toastEl.classList.add('show');
                    clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
                }

                async function copyText(text) {
                    // 方案 1：现代 Clipboard API（HTTPS / 安全上下文）
                    if (navigator.clipboard && window.isSecureContext) {
                        try {
                            await navigator.clipboard.writeText(text);
                            return true;
                        } catch (err) {
                            // clipboard API 被拒或不可用 → 继续尝试降级方案
                            console.warn('clipboard API 不可用，降级中：', err);
                        }
                    }
                    // 方案 2：execCommand 降级（file:// 或老浏览器）
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        ta.style.left = '-9999px';   // 某些浏览器 select() 需要可见
                        document.body.appendChild(ta);
                        ta.focus();
                        ta.select();
                        ta.setSelectionRange(0, ta.value.length);
                        const ok = document.execCommand('copy');
                        document.body.removeChild(ta);
                        return ok;
                    } catch (err) {
                        console.warn('execCommand copy 也失败：', err);
                        return false;
                    }
                }

                // 批量绑定：所有带 data-copy-value 的按钮都支持复制
                document.querySelectorAll('[data-copy-value]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const value = btn.dataset.copyValue;
                        const label = btn.dataset.copyId === 'email' ? '邮箱' : '微信';
                        const ok = await copyText(value);
                        showToast(ok ? `${label}已复制：${value}` : '复制失败，请手动选择复制');
                        if (ok) incrementCopy();
                    });
                });

                /* ========================================================
                 * 4. 初始化入口
                 * ====================================================== */
                function boot() {
                    initTheme();   // 先初始化主题，避免闪烁
                    initStats();
                    document.getElementById('year').textContent = new Date().getFullYear();
                }

                // DOM 就绪后启动
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', boot);
                } else {
                    boot();
                }
            })();
    </script>
</body>

</html>
